services:
  waterpolo-postgres:
    image: postgres:16-alpine
    container_name: waterpolo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: waterpolo
      POSTGRES_PASSWORD: waterpolo_password_123
      POSTGRES_DB: waterpolo_stats
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterpolo"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - coolify

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waterpolo-app
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://waterpolo:waterpolo_password_123@waterpolo-postgres:5432/waterpolo_stats?schema=public"
      NODE_ENV: production
    depends_on:
      waterpolo-postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cap-track.rule=Host(`cap-track.cebo.tech`)"
      - "traefik.http.routers.cap-track.tls=true"
      - "traefik.http.routers.cap-track.tls.certresolver=letsencrypt"
      - "traefik.http.services.cap-track.loadbalancer.server.port=3000"
    networks:
      - coolify

volumes:
  postgres_data:
    name: waterpolo_postgres_data
    driver: local

networks:
  coolify:
    external: true
