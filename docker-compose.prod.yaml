## ─── WaterPolo Stats — Production Docker Compose for Coolify ───
## Domeny i SSL zarządza Coolify (pola "Domains for ..." w UI).
## NIE dodawaj ręcznych etykiet Traefik — Coolify wstrzykuje własne na
## podstawie domen z UI; ręczne etykiety powodują konflikty routerów.

services:
  waterpolo-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: waterpolo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: waterpolo_stats
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterpolo -d waterpolo_stats"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default  # baza tylko wewnętrznie — nie na publicznej sieci proxy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://waterpolo:${POSTGRES_PASSWORD}@waterpolo-postgres:5432/waterpolo_stats"
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: '["https://wts-stats.cebo.tech"]'
    depends_on:
      waterpolo-postgres:
        condition: service_healthy
    expose:
      - "8000"  # Coolify mapuje domenę backendu na ten port
    networks:
      - default
      - coolify

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "https://api.wts-stats.cebo.tech"
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    expose:
      - "3000"  # Coolify mapuje domenę frontendu na ten port
    networks:
      - default
      - coolify

volumes:
  postgres_data:
    driver: local

networks:
  coolify:
    external: true
