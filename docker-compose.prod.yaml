## ─── WaterPolo Stats — Production Docker Compose for Coolify ───
## Domeny i SSL zarządza Coolify (pola "Domains for ..." w UI).
## NIE dodawaj ręcznych etykiet ROUTERÓW Traefika (traefik.http.routers/services...)
## — Coolify wstrzykuje własne na podstawie domen z UI; duplikaty psują routing.
##
## Topologia jak w działającym cebo.tech: WSZYSTKO na jednej sieci 'coolify'.
## Jedna sieć => Traefik nigdy nie ma wątpliwości, którego IP użyć (brak 503
## "no available server"). Dlatego NIE potrzeba etykiety 'traefik.docker.network'.

services:
  waterpolo-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: waterpolo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: waterpolo_stats
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterpolo -d waterpolo_stats"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      # Sieć 'coolify' to sieć wewnętrzna Coolify, NIE internet — baza nie ma
      # domeny/routera, więc jest nieosiągalna z zewnątrz. Unikalna nazwa
      # 'waterpolo-postgres' => brak kolizji z serwisem 'postgres' cebo.tech.
      - coolify

  waterpolo-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - coolify

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://waterpolo:${POSTGRES_PASSWORD}@waterpolo-postgres:5432/waterpolo_stats"
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: '["https://cap-track.cebo.tech"]'
      # Sterowanie głosem — warstwa AI (Claude). Pusty = sam parser deterministyczny.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Auto-wykrywanie startu transmisji YouTube (liveStreamingDetails.actualStartTime).
      # Pusty = start trzeba ustawić ręcznie ("Ustaw start = teraz").
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      # Voice-note audio storage (MinIO/S3)
      STORAGE_BACKEND: "s3"
      S3_ENDPOINT: "http://waterpolo-minio:9000"
      S3_BUCKET: "voice-notes"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: "us-east-1"
    depends_on:
      waterpolo-postgres:
        condition: service_healthy
    expose:
      - "8000" # Coolify mapuje domenę backendu na ten port
    networks:
      - coolify

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "https://api.cap-track.cebo.tech"
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    expose:
      - "3000" # Coolify mapuje domenę frontendu na ten port
    networks:
      - coolify

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  coolify:
    external: true
