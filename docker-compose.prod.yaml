## ─── WaterPolo Stats — Production Docker Compose for Coolify ───
## Domeny i SSL zarządza Coolify (pola "Domains for ..." w UI).
## NIE dodawaj ręcznych etykiet ROUTERÓW Traefika (traefik.http.routers/services...)
## — Coolify wstrzykuje własne na podstawie domen z UI; duplikaty psują routing.
## Wyjątek: 'traefik.docker.network' (patrz backend) to tylko wskazówka sieci,
## nie router — jest bezpieczna i konieczna przy kontenerze w wielu sieciach.

services:
  waterpolo-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: waterpolo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: waterpolo_stats
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterpolo -d waterpolo_stats"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default  # baza tylko wewnętrznie — nie na publicznej sieci proxy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://waterpolo:${POSTGRES_PASSWORD}@waterpolo-postgres:5432/waterpolo_stats"
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: '["https://wts-stats.cebo.tech"]'
    depends_on:
      waterpolo-postgres:
        condition: service_healthy
    expose:
      - "8000"  # Coolify mapuje domenę backendu na ten port
    networks:
      - default   # dostęp do bazy waterpolo-postgres (izolowana, poza proxy)
      - coolify   # widoczność dla proxy Coolify/Traefik
    labels:
      # Backend jest w DWÓCH sieciach (default+coolify). To NIE jest etykieta
      # routera — to tylko wskazówka, którą sieć Traefik ma użyć do połączenia
      # z kontenerem. Bez niej trafia na IP z 'default' i zwraca 503
      # "no available server". Nie koliduje z routerami wstrzykiwanymi przez Coolify.
      - "traefik.docker.network=coolify"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "https://api.wts-stats.cebo.tech"
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    expose:
      - "3000"  # Coolify mapuje domenę frontendu na ten port
    networks:
      # Front rozmawia z backendem przez publiczny https://api.wts-stats.cebo.tech
      # (NEXT_PUBLIC_API_URL, wywołania z przeglądarki), więc NIE potrzebuje sieci
      # 'default'. Tylko 'coolify' => Traefik nie ma wątpliwości, którego IP użyć.
      - coolify

volumes:
  postgres_data:
    driver: local

networks:
  coolify:
    external: true
